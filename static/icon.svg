<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Margin: a page, its red margin rule, and a note in the margin.
       Few bold shapes, no thin lines — must survive 16x16 (Apple HIG). -->
  <!-- No outline: dark-mode guidance says contrast comes from the tile
       color itself, not a stroke. Paper is one step deeper than pure cream
       so it still separates from white/light-gray tab bars. -->
  <rect width="64" height="64" rx="14" fill="#EDE2C9"/>
  <line x1="22" y1="7" x2="22" y2="57" stroke="#C43D33" stroke-width="3.5"/>
  <g stroke="#5D6883" stroke-width="5" stroke-linecap="round">
    <line x1="29" y1="18" x2="53" y2="18"/>
    <line x1="29" y1="32" x2="47" y2="32"/>
    <line x1="29" y1="46" x2="52" y2="46"/>
  </g>
  <!-- Asterisk sized for ~2 units of clear air before the rule at x=20.25
       (tips + round caps reach x=18.2) — touching would fuse the shapes.
       Blue ink: mid-luminance (survives iOS's auto-darkened home-screen
       icons, unlike near-black) and distinct from both the red rule and
       the slate text — a reader's pen, not the page's printing. -->
  <g stroke="#3D6BB3" stroke-width="4" stroke-linecap="round">
    <line x1="11.5" y1="18.5" x2="11.5" y2="29.5"/>
    <line x1="6.8" y1="21.25" x2="16.2" y2="26.75"/>
    <line x1="16.2" y1="21.25" x2="6.8" y2="26.75"/>
  </g>
</svg>
